services:
  - type: web
    name: ecjtu-campus-assistant
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # 以下敏感配置在 Render 控制台填写，不写入仓库。
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRAE_API_KEY
        sync: false
      - key: TRAE_API_BASE_URL
        sync: false
      - key: TRAE_MODEL
        sync: false
      - key: TRAE_EMBEDDING_MODEL
        sync: false
